name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python tests
        run: PYTHONPATH=python python -m unittest discover -s tests -v
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with strict warnings and sanitizers
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Icpp/include cpp/tests/test_algorithms.cpp -o /tmp/algolab-tests
      - name: Run C++ tests
        run: /tmp/algolab-tests
